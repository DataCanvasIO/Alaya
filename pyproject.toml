[project]
name = "alaya"
version = "0.0.0"
description = "Alaya model usage and supervised fine-tuning utilities"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

dependencies = [
  "torch==2.1.0",
  "transformers==4.33.3",
  "einops==0.5.0",
  "flask",
  "pydantic",
]

[project.optional-dependencies]
sft = [
  "peft",
  "trl",
  "datasets",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"


